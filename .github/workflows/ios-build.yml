name: Build iOS App

on:
  push:
    branches:
      - claude/virtual-human-marketing-BlUij
      - main
    paths:
      - 'experiments/virtual-human-ios/**'
      - 'experiments/virtual-human/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xcode build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: experiments/virtual-human-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -e
          sw_vers
          xcodebuild -version
          xcode-select -p
          python3 --version
          which xcrun

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate schedules JSON
        run: |
          set -e
          ./generate-schedules.sh
          ls -lh Resources/schedules.json

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate --spec project.yml
          ls -la VirtualHumanMonitor.xcodeproj
          ls -la VirtualHumanMonitor.xcodeproj/xcshareddata/xcschemes/ || true

      - name: Show schemes & targets
        run: |
          xcodebuild -list -project VirtualHumanMonitor.xcodeproj

      - name: Show available iOS simulators
        run: |
          xcrun simctl list devices ios available | head -40

      - name: Build for iOS Simulator
        id: build
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project VirtualHumanMonitor.xcodeproj \
            -scheme VirtualHumanMonitor \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $rc"
          if [ $rc -ne 0 ]; then
            # Emit each significant error/warning line as a public ::error:: annotation
            grep -E "(error:|fatal error|cannot find|undeclared|Use of undeclared|expected|extraneous|missing|argument labels|incorrect argument|** BUILD FAILED)" build.log \
              | head -15 \
              | awk '{
                  gsub(/%/, "%25");
                  gsub(/\r/, "");
                  gsub(/\n/, "%0A");
                  gsub(/::/, "%3A%3A");
                  print "::error::" $0
                }'
            # Also write to step summary
            {
              echo "## ❌ xcodebuild failed (exit $rc)"
              echo ""
              echo '```'
              grep -E "(error:|fatal error|cannot find|undeclared|** BUILD FAILED|The following build commands failed|Undefined symbol)" build.log | head -50
              echo "..."
              tail -100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: Locate built .app
        id: locate
        run: |
          set -e
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced"
            find DerivedData -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          # Verify schedules.json is in bundle
          ls -la "$APP_PATH/schedules.json" || echo "::warning::schedules.json missing from app bundle"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package .app as zip
        run: |
          set -e
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ZIP_NAME="VirtualHumanMonitor-iOSSimulator.zip"
          (cd "$(dirname "$APP_PATH")" && zip -ry "$OLDPWD/$ZIP_NAME" "$(basename "$APP_PATH")")
          ls -lh "$ZIP_NAME"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHumanMonitor-iOSSimulator
          path: experiments/virtual-human-ios/VirtualHumanMonitor-iOSSimulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: experiments/virtual-human-ios/build.log
          if-no-files-found: ignore
