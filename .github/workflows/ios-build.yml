name: Build iOS App

on:
  push:
    branches:
      - claude/virtual-human-marketing-BlUij
      - main
    paths:
      - 'experiments/virtual-human-ios/**'
      - 'experiments/virtual-human/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Xcode build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: experiments/virtual-human-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -e
          sw_vers
          xcodebuild -version
          xcode-select -p
          python3 --version
          which xcrun

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate schedules JSON
        run: |
          set -e
          ./generate-schedules.sh
          ls -lh Resources/schedules.json

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate --spec project.yml
          ls -la VirtualHumanMonitor.xcodeproj
          ls -la VirtualHumanMonitor.xcodeproj/xcshareddata/xcschemes/ || true

      - name: Show schemes & targets
        run: |
          xcodebuild -list -project VirtualHumanMonitor.xcodeproj

      - name: Show available iOS simulators
        run: |
          xcrun simctl list devices ios available | head -40

      - name: Build for iOS Simulator
        id: build
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project VirtualHumanMonitor.xcodeproj \
            -scheme VirtualHumanMonitor \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $rc"
          if [ $rc -ne 0 ]; then
            # Emit each significant error/warning line as a public ::error:: annotation
            grep -E "(error:|fatal error|cannot find|undeclared|Use of undeclared|expected|extraneous|missing|argument labels|incorrect argument|** BUILD FAILED)" build.log \
              | head -15 \
              | awk '{
                  gsub(/%/, "%25");
                  gsub(/\r/, "");
                  gsub(/\n/, "%0A");
                  gsub(/::/, "%3A%3A");
                  print "::error::" $0
                }'
            # Also write to step summary
            {
              echo "## ❌ xcodebuild failed (exit $rc)"
              echo ""
              echo '```'
              grep -E "(error:|fatal error|cannot find|undeclared|** BUILD FAILED|The following build commands failed|Undefined symbol)" build.log | head -50
              echo "..."
              tail -100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: Locate built .app
        id: locate
        run: |
          set -e
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced"
            find DerivedData -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          # Verify schedules.json is in bundle
          ls -la "$APP_PATH/schedules.json" || echo "::warning::schedules.json missing from app bundle"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package .app as zip
        run: |
          set -e
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ZIP_NAME="VirtualHumanMonitor-iOSSimulator.zip"
          (cd "$(dirname "$APP_PATH")" && zip -ry "$OLDPWD/$ZIP_NAME" "$(basename "$APP_PATH")")
          ls -lh "$ZIP_NAME"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHumanMonitor-iOSSimulator
          path: experiments/virtual-human-ios/VirtualHumanMonitor-iOSSimulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: experiments/virtual-human-ios/build.log
          if-no-files-found: ignore

      - name: Publish build log to ci-debug-logs branch (failure)
        if: always() && steps.build.conclusion == 'failure'
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -x
          BUILD_LOG=experiments/virtual-human-ios/build.log
          if [ ! -f "$BUILD_LOG" ]; then
            echo "no build.log; creating placeholder"
            mkdir -p experiments/virtual-human-ios
            echo "build.log was missing" > "$BUILD_LOG"
          fi
          ls -lh "$BUILD_LOG"

          # Stash content outside the worktree before we mutate it
          cp "$BUILD_LOG" /tmp/build.log
          grep -E "(error:|fatal error|cannot find|undeclared|warning:|❌|BUILD FAILED)" \
            "$BUILD_LOG" > /tmp/errors.txt 2>/dev/null || true
          tail -300 "$BUILD_LOG" > /tmp/tail.txt
          {
            echo "Run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Exit: 74"
          } > /tmp/meta.txt

          git config user.email "ci@github.actions"
          git config user.name "ci-bot"

          # Reuse the cached credentials from actions/checkout
          git fetch origin ci-debug-logs:ci-debug-logs 2>/dev/null || true
          git checkout --orphan ci-debug-logs-new
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx -e .git

          cp /tmp/build.log build.log
          cp /tmp/errors.txt errors.txt
          cp /tmp/tail.txt tail.txt
          cp /tmp/meta.txt meta.txt

          git add build.log errors.txt tail.txt meta.txt
          git commit -m "Build log run ${{ github.run_id }}"
          git push -f origin ci-debug-logs-new:ci-debug-logs

          echo ""
          echo "✅ Published. Inspect from anywhere:"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/errors.txt"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/tail.txt"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/build.log"
