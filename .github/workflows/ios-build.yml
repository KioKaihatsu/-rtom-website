name: Build iOS App

on:
  push:
    branches:
      - claude/virtual-human-marketing-BlUij
      - main
    paths:
      - 'experiments/virtual-human-ios/**'
      - 'experiments/virtual-human/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Xcode build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: experiments/virtual-human-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -e
          sw_vers
          xcodebuild -version
          xcode-select -p
          python3 --version
          which xcrun

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate schedules JSON
        run: |
          set -e
          ./generate-schedules.sh
          ls -lh Resources/schedules.json

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate --spec project.yml
          ls -la VirtualHumanMonitor.xcodeproj
          ls -la VirtualHumanMonitor.xcodeproj/xcshareddata/xcschemes/ || true

      - name: Show schemes & targets
        run: |
          set +e
          xcodebuild -list -project VirtualHumanMonitor.xcodeproj 2>&1 | tee /tmp/list.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild -list exit: $rc"
          if [ $rc -ne 0 ]; then
            echo "::error::xcodebuild -list failed with exit $rc"
            head -20 /tmp/list.log | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/::/%3A%3A/g' | head -c 200)
              echo "::warning::list: ${clean}"
            done
          fi
          exit 0   # continue regardless

      - name: Show available iOS simulators
        run: |
          xcrun simctl list devices ios available | head -40

      - name: Smoke test (build minimal SwiftUI app)
        id: smoke
        run: |
          set -e
          mkdir -p /tmp/smoke/App /tmp/smoke/Res
          cat > /tmp/smoke/App/SmokeApp.swift <<'EOF'
          import SwiftUI
          @main
          struct SmokeApp: App {
            var body: some Scene {
              WindowGroup { Text("smoke").padding() }
            }
          }
          EOF
          cat > /tmp/smoke/Res/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          EOF
          cat > /tmp/smoke/project.yml <<'EOF'
          name: Smoke
          options:
            deploymentTarget:
              iOS: "17.0"
          targets:
            Smoke:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: jp.test.smoke
                  PRODUCT_NAME: Smoke
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: Res/Info.plist
                  CODE_SIGNING_ALLOWED: NO
          EOF
          cd /tmp/smoke
          xcodegen generate
          xcodebuild build \
            -project Smoke.xcodeproj \
            -scheme Smoke \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          echo "✅ smoke build succeeded"

      - name: Build for iOS Simulator
        id: build
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project VirtualHumanMonitor.xcodeproj \
            -scheme VirtualHumanMonitor \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $rc"
          echo "build.log size: $(wc -c < build.log) bytes, $(wc -l < build.log) lines"
          if [ $rc -ne 0 ]; then
            echo "::error::Build failed with exit $rc - build.log size $(wc -c < build.log) bytes"
            # First 10 error/warning lines as annotations
            grep -nE "(error:|fatal error|cannot find|undeclared|warning:|BUILD FAILED)" build.log | head -10 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/::/%3A%3A/g')
              echo "::error::${clean}"
            done
            # Tail of log as annotations (last 5 non-empty lines)
            tail -10 build.log | grep -v '^$' | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/::/%3A%3A/g' | head -c 200)
              echo "::warning::tail: ${clean}"
            done
            exit $rc
          fi

      - name: Locate built .app
        id: locate
        run: |
          set -e
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced"
            find DerivedData -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"
          # Verify schedules.json is in bundle
          ls -la "$APP_PATH/schedules.json" || echo "::warning::schedules.json missing from app bundle"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package .app as zip
        run: |
          set -e
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ZIP_NAME="VirtualHumanMonitor-iOSSimulator.zip"
          (cd "$(dirname "$APP_PATH")" && zip -ry "$OLDPWD/$ZIP_NAME" "$(basename "$APP_PATH")")
          ls -lh "$ZIP_NAME"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHumanMonitor-iOSSimulator
          path: experiments/virtual-human-ios/VirtualHumanMonitor-iOSSimulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: experiments/virtual-human-ios/build.log
          if-no-files-found: ignore

      - name: Publish build log to ci-debug-logs branch (failure)
        if: failure() || cancelled()
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -x
          BUILD_LOG=experiments/virtual-human-ios/build.log
          if [ ! -f "$BUILD_LOG" ]; then
            echo "no build.log; using whatever we have"
            mkdir -p experiments/virtual-human-ios
            : > "$BUILD_LOG"
          fi
          # Include earlier step logs (xcodebuild -list output if it failed)
          [ -f /tmp/list.log ] && {
            echo "===== xcodebuild -list output ====="
            cat /tmp/list.log
            echo ""
          } >> "$BUILD_LOG.combined" || true
          {
            echo "===== xcodebuild build output ====="
            cat "$BUILD_LOG"
          } >> "$BUILD_LOG.combined"

          ls -lh "$BUILD_LOG" "$BUILD_LOG.combined" /tmp/list.log 2>/dev/null || true

          # Stash content outside the worktree before we mutate it
          cp "$BUILD_LOG.combined" /tmp/build.log
          grep -E "(error:|fatal error|cannot find|undeclared|warning:|❌|BUILD FAILED|missing)" \
            "$BUILD_LOG.combined" > /tmp/errors.txt 2>/dev/null || true
          tail -300 "$BUILD_LOG.combined" > /tmp/tail.txt
          {
            echo "Run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/meta.txt

          git config user.email "ci@github.actions"
          git config user.name "ci-bot"

          # Reuse the cached credentials from actions/checkout
          git fetch origin ci-debug-logs:ci-debug-logs 2>/dev/null || true
          git checkout --orphan ci-debug-logs-new
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx -e .git

          cp /tmp/build.log build.log
          cp /tmp/errors.txt errors.txt
          cp /tmp/tail.txt tail.txt
          cp /tmp/meta.txt meta.txt

          git add build.log errors.txt tail.txt meta.txt
          git commit -m "Build log run ${{ github.run_id }}"
          git push -f origin ci-debug-logs-new:ci-debug-logs

          echo ""
          echo "✅ Published. Inspect from anywhere:"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/errors.txt"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/tail.txt"
          echo "   curl https://raw.githubusercontent.com/${{ github.repository }}/ci-debug-logs/build.log"
