# XcodeGen manifest. To generate the Xcode project:
#
#   brew install xcodegen
#   cd experiments/virtual-human-ios
#   xcodegen generate
#   open VirtualHumanMonitor.xcodeproj
#
# Without XcodeGen: see README.md for manual project creation steps.

name: VirtualHumanMonitor
options:
  bundleIdPrefix: jp.kiokaihatsu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VirtualHumanMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/schedules.json
        buildPhase: resources
        type: file
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kiokaihatsu.virtualhuman.monitor
        PRODUCT_NAME: VirtualHumanMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

schemes:
  VirtualHumanMonitor:
    build:
      targets:
        VirtualHumanMonitor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
